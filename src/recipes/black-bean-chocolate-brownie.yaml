name: Sweet Potato & Black Bean Chocolate Brownie
source: https://www.gazoakleychef.com/recipes/black-bean-chocolate-brownie/
image: black-bean-chocolate-brownie.jpg
creator: Gaz Oakley
servings: 10

ingredients:
  - name: sweet potato
    quantity: 300
    unit: g
    steps: [2]
  - name: black beans
    quantity: 170
    unit: g
    steps: [2]
  - name: tahini
    quantity: 125
    unit: g
    steps: [2]
  - name: maple syrup
    quantity: 125
    unit: ml
    steps: [2]
  - name: non-dairy milk
    quantity: 80
    unit: ml
    steps: [2]
  - name: vanilla extract
    quantity: 3
    unit: tbsp
    steps: [2]
  - name: cacao powder
    quantity: 120
    unit: g
    steps: [3]
  - name: maca powder
    quantity: 3
    unit: tbsp
    steps: [3]
  - name: lions mane mushroom powder
    quantity: 1
    unit: tbsp
    steps: [3]
  - name: chaga mushroom powder
    quantity: 1
    unit: tbsp
    steps: [3]
  - name: baking powder
    quantity: 1
    unit: tsp
    steps: [3]
  - name: sea salt
    quantity: 0.5
    unit: tsp
    steps: [3, 6]
  - name: dark chocolate chips
    quantity: 150
    unit: g
    steps: [3]
  - name: hemp seeds
    quantity: 3
    unit: tbsp
    steps: [3]
  - name: chia seeds
    quantity: 3
    unit: tbsp
    steps: [3]
  - name: olive oil
    quantity: 125
    unit: ml
    steps: [4]
  - name: hazelnuts
    quantity: 1
    unit: handful
    steps: [4]
  - name: pumpkin seeds
    quantity: 1
    unit: handful
    steps: [4]
  - name: dark chocolate
    quantity: 1
    unit: handful
    steps: [6]

methods:
  - Preheat oven to 180°C and line an 8×8 inch baking dish with parchment paper.
  - Cook sweet potato until tender by baking, boiling, or steaming. Combine with black beans, tahini, maple syrup, milk, and vanilla extract in a blender until smooth. Transfer to a mixing bowl.
  - Fold in cacao powder, maca powder, Lions Mane, Chaga, sea salt, baking powder, hemp seeds, chia seeds, and chocolate chips.
  - Stir in olive oil and transfer batter to the lined tin. Top with chopped hazelnuts and pumpkin seeds.
  - Bake for 25-30 minutes.
  - Drizzle melted chocolate and sprinkle sea salt before serving.

notes:
  - Store in the refrigerator for up to one week.
