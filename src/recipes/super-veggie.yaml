name: Super Veggie
source: https://blueprint.bryanjohnson.com/blogs/news/how-to-make-my-anti-aging-lunch-live-to-120
image: super-veggie.jpg
servings: 1
ingredients:
  - name: cauliflower
    quantity: 150
    unit: g
    steps: [1, 2]
  - name: broccoli
    quantity: 250
    unit: g
    steps: [1, 2]
  - name: shiitake or maitake mushrooms
    quantity: 50
    unit: g
    steps: [2]
  - name: garlic
    quantity: 1
    unit: clove
    steps: [1, 2]
  - name: ginger
    quantity: 3
    unit: g
    steps: [1, 2]
  - name: cooked black lentils
    quantity: 150
    unit: g
    steps: [3]
  - name: cumin
    quantity: 1
    unit: tbsp
    steps: [5]
  - name: hemp seeds
    quantity: 1
    unit: tbsp
    steps: [5]
  - name: apple cider vinegar
    quantity: 1
    unit: tbsp
    steps: [5]
  - name: extra virgin olive oil
    quantity: 1
    unit: tbsp
    steps: [5]
methods:
  - Chop the cauliflower, broccoli, ginger, and garlic.
  - Boil the cauliflower, broccoli, ginger, garlic, and mushrooms together for 7-9 minutes until soft, then drain.
  - Add the cooked black lentils to a bowl as the base.
  - Top with your boiled veggies.
  - Finish with the cumin, hemp seeds, apple cider vinegar, and extra virgin olive oil.
creator: Bryan Johnson
notes:
  - Bryan sometimes adds the juice of 1 lime and 1-4 tbsp of fermented foods (cabbage, kimchi, or beets).
  - 'Smoothie-bowl variant: add the boiled veggies, all other ingredients, and a little water to a blender and blend until smooth. Top with hemp seeds, extra virgin olive oil, and high-quality dark chocolate (optional).'
  - One of Bryan's go-to longevity lunches — he eats it almost every day.
