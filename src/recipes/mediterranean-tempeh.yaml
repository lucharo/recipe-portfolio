name: Quick Mediterranean Tempeh
source: https://claude.ai/share/d756269f-7bee-4776-bbf6-1ec486054f4e
image: mediterranean-tempeh.jpg
servings: 4
ingredients:
  - name: tempeh block, cubed
    quantity: 400
    unit: g
    steps: [1, 3]
  - name: olive oil
    quantity: 3
    unit: tbsp
    steps: [2]
  - name: lemon, juiced
    quantity: 1
    unit: ''
    steps: [2]
  - name: garlic, crushed
    quantity: 3
    unit: clove
    steps: [2]
  - name: soy sauce or tamari
    quantity: 2
    unit: tbsp
    steps: [2]
  - name: maple syrup
    quantity: 1
    unit: tsp
    steps: [2]
  - name: dried oregano
    quantity: 1
    unit: tsp
    steps: [2]
  - name: smoked paprika
    quantity: 1
    unit: tsp
    steps: [2]
  - name: sun-dried tomato paste
    quantity: 1
    unit: tbsp
    steps: [2]
  - name: salt
    quantity: 0.25
    unit: tsp
    steps: [2]
  - name: black pepper
    quantity: 0.25
    unit: tsp
    steps: [2]
methods:
  - Heat the oven to 200°C and line a tray. Cube the tempeh.
  - In a large bowl, whisk together the olive oil, lemon juice, garlic, soy sauce or tamari, maple syrup, oregano, smoked paprika, sun-dried tomato paste, salt and pepper.
  - Add the tempeh to the bowl and toss until every piece is coated.
  - Spread the tempeh on the tray in a single layer. Bake for about 20 minutes, shaking the tray halfway, until golden with crisp edges.
  - Drizzle any leftover mix over the top.
notes:
  - No marinating needed. Just toss and bake.
  - No soy? Use 2 tsp miso + 2 tbsp water, or ½ tsp salt + 2 tbsp water.
  - Pairs with lemon-herb buckwheat. Start the buckwheat when the tray goes in and both finish together.
