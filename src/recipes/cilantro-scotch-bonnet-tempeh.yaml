name: Cilantro Scotch Bonnet Tempeh
source: https://www.gazoakleychef.com/recipes/cilantro-marinated-tempeh/
image: cilantro-scotch-bonnet-tempeh.jpg
servings: 4
ingredients:
  - name: coriander
    quantity: 1
    unit: handful
    steps: [2, 5]
  - name: dried scotch bonnet
    quantity: 1
    unit: tbsp
    steps: [2]
  - name: spring onions
    quantity: 4
    unit: ''
    steps: [2]
  - name: garlic cloves
    quantity: 4
    unit: clove
    steps: [2]
  - name: preserved lemon
    quantity: 1
    unit: ''
    steps: [2]
  - name: pomegranate molasses
    quantity: 3
    unit: tbsp
    steps: [2]
  - name: sumac
    quantity: 1
    unit: tbsp
    steps: [2]
  - name: soy sauce
    quantity: 4
    unit: tbsp
    steps: [2]
  - name: extra virgin olive oil
    quantity: 0.25
    unit: cup
    steps: [2]
  - name: sea salt
    quantity: 0.5
    unit: tsp
    steps: [2, 4]
  - name: tempeh
    quantity: 2
    unit: ''
    steps: [3]
  - name: cornflour
    quantity: 6
    unit: tbsp
    steps: [3]
  - name: oil for frying
    quantity: 1
    unit: ''
    steps: [3]
  - name: cannellini beans
    quantity: 4
    unit: cup
    steps: [4]
  - name: onion
    quantity: 1
    unit: ''
    steps: [4]
  - name: olive oil
    quantity: 3
    unit: tbsp
    steps: [4]
  - name: dried porcini mushrooms
    quantity: 1
    unit: cup
    steps: [4]
  - name: white wine
    quantity: 1
    unit: cup
    steps: [4]
  - name: pistachio nuts
    quantity: 1
    unit: handful
    steps: [5]
methods:
  - Preheat oven to 180°C.
  - Blend coriander, scotch bonnet, spring onions, garlic, preserved lemon, pomegranate molasses, sumac, soy sauce, olive oil, and sea salt until smooth.
  - Coat tempeh fillets in cornflour, then fry in oil until golden. Pour marinade over tempeh and cook until caramelized. Bake for 10 minutes.
  - Rehydrate porcini mushrooms in boiling water, then chop finely, reserving the liquid. Caramelize onions in olive oil, add mushrooms, white wine, mushroom liquid, beans, and salt. Simmer until creamy.
  - Serve tempeh with beans, garnished with coriander, pistachios, and reserved marinade.
creator: Gaz Oakley
